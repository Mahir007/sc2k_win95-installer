name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', LICENSE]
  workflow_dispatch:
  # release.yml runs this to test and build a tagged version.
  workflow_call:
    inputs:
      version:
        description: The version to put in the script, such as 1.0.0
        type: string
        required: true

# A newer push to the same branch cancels the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/modules
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $env:PSModulePath = $env:PS_MODULES + [IO.Path]::PathSeparator + $env:PSModulePath
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize -Wrap
          if ($results) { exit 1 }
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # The script runs on Windows PowerShell 5.1 and PowerShell 7. The release
  # notes script runs on Linux, in release.yml.
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
            path: tests
          - name: PowerShell 7 on Windows
            os: windows-latest
            shell: pwsh
            path: tests
          - name: PowerShell 7 on Linux
            os: ubuntu-latest
            shell: pwsh
            path: tests/New-ReleaseNotes.Tests.ps1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # A step's shell can't use the matrix context; job defaults can.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/modules
      - name: Pester
        env:
          TEST_PATH: ${{ matrix.path }}
        run: |
          $env:PSModulePath = $env:PS_MODULES + [IO.Path]::PathSeparator + $env:PSModulePath
          Import-Module Pester -MinimumVersion 5.0
          $config = New-PesterConfiguration
          $config.Run.Path = $env:TEST_PATH
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The script in the repository says its version is 0.0.0-dev. The copy
      # in the archive gets the release's version, or 0.0.0-dev+<commit>.
      - name: Put the version in the script
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version=${VERSION:-0.0.0-dev+${GITHUB_SHA::7}}
          mkdir dist
          sed "s/^\$ScriptVersion = '0\.0\.0-dev'/\$ScriptVersion = '$version'/" src/sc2k_install.ps1 >dist/sc2k_install.ps1
          if ! grep -qF "\$ScriptVersion = '$version'" dist/sc2k_install.ps1; then
            echo "::error::src/sc2k_install.ps1 has no \$ScriptVersion = '0.0.0-dev' line to put the version in"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # The same commit always gives the same archive: the files get the
      # commit's time instead of the checkout's.
      - name: Build the archive
        working-directory: dist
        run: |
          cp ../LICENSE LICENSE
          touch -d "@$(git log -1 --format=%ct)" LICENSE sc2k_install.ps1
          7z a -tzip -mx=9 -bd sc2k_install.zip LICENSE sc2k_install.ps1
          sha256sum sc2k_install.zip >sc2k_install.zip.sha256

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### sc2k_install.zip"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | $VERSION |"
            echo "| Size | $(stat -c %s dist/sc2k_install.zip) bytes |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 dist/sc2k_install.zip.sha256)\` |"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/sc2k_install.zip
            dist/sc2k_install.zip.sha256
          retention-days: 1
          if-no-files-found: error

  # The checks a user's PC would make: Windows extracts the archive, and the
  # script in it starts under both PowerShells and says its version.
  check:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Check the archive
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          Expand-Archive dist/sc2k_install.zip extracted
          Get-ChildItem extracted
          foreach ($shell in 'powershell', 'pwsh') {
            $got = & $shell -NoProfile -ExecutionPolicy Bypass -File extracted/sc2k_install.ps1 -Version
            if ("$got".Trim() -ne $env:VERSION) {
              Write-Output "::error::$shell says the version is '$got', not $env:VERSION"
              exit 1
            }
            Write-Output "$shell`: $got"
          }
