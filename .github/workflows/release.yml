name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The notes need the history and tags back to the previous release
        with:
          fetch-depth: 0
      # The script in the repository says its version is 0.0.0-dev; the copy
      # in the release gets the tag's.
      - name: Put the tag's version in the script
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
            echo "$GITHUB_REF_NAME isn't a version tag, such as v1.0.0 or v1.0.0-preview.1" >&2
            exit 1
          fi
          mkdir dist
          sed "s/^\$ScriptVersion = '0\.0\.0-dev'/\$ScriptVersion = '$version'/" src/sc2k_install.ps1 >dist/sc2k_install.ps1
          if ! grep -qF "\$ScriptVersion = '$version'" dist/sc2k_install.ps1; then
            echo "src/sc2k_install.ps1 has no \$ScriptVersion = '0.0.0-dev' line to put the version in" >&2
            exit 1
          fi
      # The same commit always gives the same archive: the files get the
      # commit's time instead of the checkout's.
      - name: Build the archive
        run: |
          cp LICENSE dist/LICENSE
          touch -d "@$(git log -1 --format=%ct)" dist/LICENSE dist/sc2k_install.ps1
          cd dist && 7z a -tzip -mx=9 -bd sc2k_install.zip LICENSE sc2k_install.ps1
      - name: Write the checksum
        run: cd dist && sha256sum sc2k_install.zip >sc2k_install.zip.sha256
      - name: Write the release notes
        shell: pwsh
        run: ./.github/scripts/New-ReleaseNotes.ps1 -Tag $env:GITHUB_REF_NAME -Repository $env:GITHUB_REPOSITORY -ArchiveName sc2k_install.zip -OutFile dist/notes.md
      # A version with a hyphen, such as 1.0.0-preview.1, is a pre-release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            flags=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/sc2k_install.zip dist/sc2k_install.zip.sha256 --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag "${flags[@]}"
