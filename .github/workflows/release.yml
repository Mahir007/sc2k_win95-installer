name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the script version
        run: |
          version=$(sed -n "s/^\$ScriptVersion = '\(.*\)'.*/\1/p" src/sc2k_install.ps1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match \$ScriptVersion $version" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" src/sc2k_install.ps1 --title "$GITHUB_REF_NAME" --generate-notes
